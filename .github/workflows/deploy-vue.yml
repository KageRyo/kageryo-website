name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --ignore-scripts
      
    - name: Lint
      run: npm run lint

    - name: Test
      run: npm run test

    - name: Install Chromium for accessibility checks
      run: ./node_modules/.bin/playwright install --with-deps chromium

    - name: Accessibility test
      run: npm run test:a11y

    - name: End-to-end interaction test
      run: npm run test:e2e

    - name: Build Vue app
      run: npm run build

    # The WaterMirror product site lives in its own public repository and is
    # served from this domain at /watermirror/. Its CI starts this workflow
    # after each push to its main branch.
    - name: Check out the WaterMirror website
      uses: actions/checkout@v7
      with:
        repository: KageRyo/watermirror-website
        ref: main
        path: .watermirror-website
        persist-credentials: false

    - name: Build the WaterMirror website into /watermirror/
      working-directory: .watermirror-website
      env:
        PAGES_BASE_PATH: /watermirror
        SITE_URL: https://kageryo.coderyo.com/watermirror
      run: |
        npm ci --ignore-scripts
        npm run build
        test ! -e ../dist/watermirror
        cp -R out ../dist/watermirror

    - name: Setup Pages
      uses: actions/configure-pages@v6
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
